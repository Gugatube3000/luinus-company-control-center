name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Build the password-gated mobile control center. Area content is
      # published ONLY as AES-256-GCM ciphertext (content.enc.json) encrypted
      # with the SITE_PASSWORD secret; personal/ is never included at all.
      # The public Luinus dashboard app is copied to /luinus-dashboard/.
      - name: Build site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node site/build.mjs _site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
