<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080f" />
    <title>Luinus · Company Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-grid"></div>

    <div class="app">
      <!-- ===== Sidebar ===== -->
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">L</div>
          <div class="brand-text">
            <div class="brand-name">Luinus</div>
            <div class="brand-sub">Control Center</div>
          </div>
        </div>

        <nav class="nav" id="nav">
          <button class="nav-item" data-view="mission"><span class="nav-ico">◎</span> Mission Control</button>
          <button class="nav-item" data-view="kanban"><span class="nav-ico">▦</span> Kanban Board</button>
          <button class="nav-item" data-view="agents"><span class="nav-ico">⬡</span> Agents</button>
          <button class="nav-item" data-view="queue"><span class="nav-ico">≡</span> Execution Queue</button>
          <button class="nav-item" data-view="decisions"><span class="nav-ico">✶</span> Decisions <span class="nav-count" id="navDecisions"></span></button>
          <button class="nav-item" data-view="alerts"><span class="nav-ico">⚠</span> Alerts <span class="nav-count danger" id="navAlerts"></span></button>
          <button class="nav-item" data-view="souls"><span class="nav-ico">✦</span> Agent Souls</button>
        </nav>

        <div class="autopilot">
          <div class="autopilot-row">
            <div>
              <div class="autopilot-title">24/7 Autopilot</div>
              <div class="autopilot-sub" id="autopilotSub">Paused</div>
            </div>
            <button class="toggle" id="autopilotToggle" role="switch" aria-checked="false"><span></span></button>
          </div>
          <p class="autopilot-note">Agents advance the company loop on their own while you're away.</p>
        </div>

        <div class="sidebar-foot">
          <div class="status-dot live"></div>
          <span id="sidebarStatus">Company live · seeded state</span>
        </div>
      </aside>

      <!-- ===== Main ===== -->
      <main class="main">
        <header class="topbar">
          <div class="topbar-left">
            <h1 id="viewTitle">Mission Control</h1>
            <p id="viewSubtitle" class="topbar-sub">What the company is doing right now — and what needs your call.</p>
          </div>
          <div class="topbar-actions">
            <span class="pill pill-live" id="cadencePill">Loop · 30m</span>
            <span class="pill" id="clockPill">—</span>
            <button class="btn btn-ghost" id="exportBtn">Export snapshot</button>
            <button class="btn btn-primary" id="refreshBtn">↻ Refresh cycle</button>
          </div>
        </header>

        <div class="view-scroll">
          <section class="view" id="view-mission"></section>
          <section class="view" id="view-kanban"></section>
          <section class="view" id="view-agents"></section>
          <section class="view" id="view-queue"></section>
          <section class="view" id="view-decisions"></section>
          <section class="view" id="view-alerts"></section>
          <section class="view" id="view-souls"></section>
        </div>
      </main>
    </div>

    <!-- ===== Drill-down drawer ===== -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-inner" id="drawerInner"></div>
    </aside>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <script src="./data.js"></script>
    <script src="./souls.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
