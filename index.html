<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080f" />
    <title>Luinus · Growth Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-grid"></div>

    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">L</div>
          <div class="brand-text">
            <div class="brand-name">Luinus</div>
            <div class="brand-sub">Growth Engine</div>
          </div>
        </div>

        <nav class="nav" id="nav">
          <button class="nav-item" data-view="command"><span class="nav-ico">◎</span> Command</button>
          <button class="nav-item" data-view="campaigns"><span class="nav-ico">🚀</span> Campaigns <span class="nav-count" id="navCampaigns"></span></button>
          <button class="nav-item" data-view="pipeline"><span class="nav-ico">▦</span> Pipeline</button>
          <button class="nav-item" data-view="inbox"><span class="nav-ico">✶</span> Inbox <span class="nav-count danger" id="navInbox"></span></button>
          <button class="nav-item" data-view="playbooks"><span class="nav-ico">📘</span> Playbooks</button>
          <button class="nav-item" data-view="team"><span class="nav-ico">⬡</span> Teams</button>
          <button class="nav-item" data-view="souls"><span class="nav-ico">✦</span> Souls</button>
        </nav>

        <div class="autopilot">
          <div class="autopilot-row">
            <div>
              <div class="autopilot-title">24/7 Autopilot</div>
              <div class="autopilot-sub" id="autopilotSub">Paused</div>
            </div>
            <button class="toggle" id="autopilotToggle" role="switch" aria-checked="false"><span></span></button>
          </div>
          <p class="autopilot-note">The team keeps sending and booking while you're away.</p>
        </div>

        <div class="sidebar-foot">
          <div class="status-dot live"></div>
          <span id="sidebarStatus">Outreach live · seeded</span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-left">
            <h1 id="viewTitle">Command</h1>
            <p id="viewSubtitle" class="topbar-sub">Tell the team what to do — and see what's already working.</p>
          </div>
          <div class="topbar-actions">
            <span class="pill" id="clockPill">—</span>
            <button class="btn btn-ghost" id="exportBtn">Export snapshot</button>
            <button class="btn btn-primary" id="refreshBtn">↻ Refresh</button>
          </div>
        </header>

        <div class="view-scroll">
          <section class="view" id="view-command"></section>
          <section class="view" id="view-campaigns"></section>
          <section class="view" id="view-pipeline"></section>
          <section class="view" id="view-inbox"></section>
          <section class="view" id="view-playbooks"></section>
          <section class="view" id="view-team"></section>
          <section class="view" id="view-souls"></section>
        </div>
      </main>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-inner" id="drawerInner"></div>
    </aside>

    <div class="toast" id="toast"></div>

    <script src="./data.js"></script>
    <script src="./souls.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
